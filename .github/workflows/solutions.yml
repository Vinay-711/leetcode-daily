name: Solution regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every solution harness, including future dated folders
        run: python scripts/check_solutions.py
